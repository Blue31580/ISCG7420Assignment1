{% extends 'base.html' %}
{% block title %}{% if slot %}Edit Slot{% else %}Add Slot{% endif %}{% endblock %}
{% block content %}
    <h1>{% if slot %}Edit Slot{% else %}Add Slot{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'doctor_dashboard' %}">Back</a>
{% endblock %}
